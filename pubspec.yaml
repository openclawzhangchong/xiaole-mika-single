name: xiaozhi_client_flutter
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 6.11.1+53

environment:
  sdk: ^3.8.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  
  # 状态管理
  flutter_riverpod: ^2.5.0
  
  # 网络请求
  dio: ^5.4.0
  http: ^1.2.0
  mqtt_client: ^10.6.0  # v3.3.0 MQTT常驻在线（原生TLS 8883直连,无需网页版的worker桥）  # v3.1.0 视觉识物 multipart 上传（ota_service 亦用，原为传递依赖现显式声明）
  retrofit: ^4.0.0
  
  # 本地存储
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  
  # 路由导航
  go_router: ^13.0.0
  
  # JSON 序列化
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1
  
  # UI 组件
  cached_network_image: ^3.3.1
  battery_plus: ^6.0.1 # v4.2.0 真实电量（申请书8号：get_device_status 读系统电池）
  share_plus: ^10.1.4 # v4.3.0 导出聊天记录（系统分享面板交付 TXT/JSON 文件）
  flutter_svg: ^2.0.10
  shimmer: ^3.0.0
  
  # 多媒体
  image_picker: ^1.0.7
  permission_handler: ^11.3.0

  # v6.8.0：AI 主动来电「后台化」（WorkManager 周期唤醒 + 高优先通知）
  # ⚠️ 本项目 Flutter 3.32.2 / Dart 3.8.1：下列版本均为兼容版（workmanager 0.5.x 与
  # flutter_local_notifications 17.x 均要求 Dart SDK >=3.3.0 <4.0.0，与本项目匹配）。
  workmanager: 0.8.0   # v6.8.1 修正根因：0.5.2 太旧(Kotlin 与 Flutter 3.32 嵌入层不兼容→构建失败)；
                       # 0.9.x 的 workmanager_apple 与 platform_interface 不匹配(Dart 编译失败)；
                       # 0.10.x 需 Flutter>=3.38。0.8.0 要求 flutter>=3.32.0，版本组合内部一致。
                       # 而 0.5.2 的 Kotlin 与 Flutter 3.32 嵌入层不兼容 → CI 构建失败。
                       # 0.9.0 要求 flutter>=3.32.0 与本项目匹配；0.9.2+1/0.9.3 因 workmanager_apple 需 Flutter>=3.38 不可用，故精确锁定 0.9.0。
  flutter_local_notifications: ^17.2.0   # 高优先来电通知 + 通知渠道

  # MCP 设备工具能力（v6.1.0，方案见 PLAN_v6.1.0_MCP设备工具能力扩展.md）
  # ⚠️ 本项目 Flutter 3.32.2：下列版本均为「锁定的兼容版」，勿随意升级
  flutter_volume_controller: 2.0.1   # 锁版：2.0.2 需 Flutter>=3.35；仅此版本提供"只改媒体流"API
  android_intent_plus: ^6.1.0        # 系统闹钟/日历/拨号/短信/导航/设置
  screen_brightness: ^2.1.11         # 屏幕亮度（仅应用级，不申请 WRITE_SETTINGS）
  flutter_tts: ^4.2.5                # 到点语音播报（调用系统自带 TTS 引擎，不下载模型）
  # torch_light: ^2.0.0              # ❌ 2.0.0 要求 Dart SDK ^3.12（本项目 3.8.1）→ 待定兼容版或改为不支持

  # 定位能力（v6.3.0，方案见 PLAN_v6.3.0）：WGS-84→GCJ-02 转换自带；权限复用现有 permission_handler
  geolocator: ^13.0.0
  
  # 工具类
  logger: ^2.0.2
  fluttertoast: ^8.2.4
  intl: ^0.19.0
  uuid: ^4.3.3
  device_info_plus: ^12.2.0
  record: ^6.1.2
  opus_dart: ^3.0.1
  audio_session: ^0.2.2
  flutter_pcm_sound: ^3.3.3
  logging: ^1.3.0
  vibration: ^3.1.4
  opus_flutter: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 代码生成
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  freezed: ^2.4.7
  hive_generator: ^2.0.1
  retrofit_generator: ^8.0.0
  
  # 测试
  mockito: ^5.4.4
  
  # 代码质量
  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

