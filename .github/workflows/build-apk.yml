name: Build Release APK

# 目标：云端出可安装的 release APK，签名稳定（每次构建证书指纹一致，可覆盖安装）。
# - 手动触发：Actions 页面 / gh workflow run
# - push：仅默认分支且命中相关路径（省额度）
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-apk.yml'

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # 稳定签名参数：keystore 随仓库提交（android/app/xiaole-release.p12），密码不追求保密，
    # 因此直接写在 env 里而不是 Secrets —— 保证公开仓库/无 Secrets 环境也能跑通。
    env:
      XIAOLE_KEYSTORE_PASSWORD: 'REDACTED-KEYSTORE-PASSWORD'
      XIAOLE_KEY_PASSWORD: 'REDACTED-KEYSTORE-PASSWORD'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Flutter 3.32.2 / Dart 3.8.x，对应 pubspec.yaml `environment: sdk: ^3.8.0`
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter 3.32.2 (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.2'
          channel: 'stable'
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # 允许失败：静态检查不阻塞出包，但输出必须可见（日志 + Job Summary）
      - name: flutter analyze (non-blocking)
        id: analyze
        continue-on-error: true
        run: |
          set +e
          flutter analyze 2>&1 | tee analyze.log
          echo "### flutter analyze" >> "$GITHUB_STEP_SUMMARY"
          if grep -qiE "issues found|error •|warning •" analyze.log; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 40 analyze.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "无问题输出" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Read version
        id: vars
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "APK_NAME=xiaole-${VERSION}-${SHORT_SHA}-release.apk" >> "$GITHUB_OUTPUT"

      - name: flutter build apk (release, 稳定签名)
        run: flutter build apk --release

      - name: Verify APK metadata & signature
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BUILD_TOOLS=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)
          echo "build-tools: $BUILD_TOOLS"
          echo "## APK 元数据" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | head -n 3 >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "## 签名校验" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          "$BUILD_TOOLS/apksigner" verify --print-certs --verbose "$APK" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${{ steps.vars.outputs.APK_NAME }}"
          cp analyze.log dist/analyze.log || true
          sha256sum "dist/${{ steps.vars.outputs.APK_NAME }}" | tee dist/SHA256SUMS.txt
          ls -l dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaole-apk-${{ steps.vars.outputs.version }}-${{ steps.vars.outputs.short_sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
