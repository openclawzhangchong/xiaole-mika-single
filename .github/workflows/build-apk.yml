name: Build Debug APK

# 仅在一个 workflow 里做"能出包"这件事：
# - 手动触发：Actions 页面 / gh workflow run
# - push：仅默认分支且命中相关路径（省额度，避免每次 push 全量构建）
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-apk.yml'

# 同一分支重复触发时取消旧任务，避免白烧额度
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Flutter 3.32.2 / Dart 3.8.x：与 pubspec.yaml `environment: sdk: ^3.8.0`
      # 及 android/gradle 配置匹配（项目内注释亦有说明）
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter 3.32.2 (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.2'
          channel: 'stable'
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # 允许失败：仅做静态检查提示，不阻塞出包；错误在日志与 Job Summary 中可见，不静默吞掉
      - name: flutter analyze (non-blocking)
        id: analyze
        continue-on-error: true
        run: |
          set +e
          flutter analyze 2>&1 | tee analyze.log
          echo "analyze_exit=${PIPESTATUS[0]}"
          echo "### flutter analyze 结果" >> "$GITHUB_STEP_SUMMARY"
          if grep -qiE "^ *(error|warning|info) *•|issues found" analyze.log; then
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            tail -n 40 analyze.log >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "无问题输出" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Read version
        id: vars
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "APK_NAME=xiaole-${VERSION}-${SHORT_SHA}-debug.apk" >> "$GITHUB_OUTPUT"

      # 先用 debug 签名，零 Secrets 即可跑通（可装可跑，不可上架）
      # 后续接正式签名时：把 keystore 以 base64 存在 Secrets，并在此前增加一步解码到 android/app/，
      # 在 android/app/build.gradle.kts 的 buildTypes.release 里改用 signingConfigs.release。
      # 需要的 Secrets 名（现在不引用，避免不存在导致失败）：
      #   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
      - name: flutter build apk (debug)
        run: flutter build apk --debug

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk "dist/${{ steps.vars.outputs.APK_NAME }}"
          cp analyze.log dist/analyze.log || true
          ls -l dist
          sha256sum "dist/${{ steps.vars.outputs.APK_NAME }}" | tee dist/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaole-apk-${{ steps.vars.outputs.version }}-${{ steps.vars.outputs.short_sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
