name: Build Xiaole Single APK

# 正式单包构建:小乐(Flutter) + Mika(Kotlin 引擎)编进同一个 APK。
# 1. 检出本仓库(小乐 6.11.12 基线 + 嵌入改动)
# 2. scripts/fetch-mika.sh 把 Mika 固定到 6661b9e9 并打 patches/mika-embed.patch
# 3. android/settings.gradle.kts 以 include(":mika-core")/include(":mika-app") 并入
# 4. 一次跑出两个包:universal(arm64+armv7) 与 arm64(主分发);两者 versionCode 同为 80
on:
  workflow_dispatch:
  push:
    branches:
      - feat/single-apk
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'patches/**'
      - 'scripts/**'
      - '.github/workflows/build-merged-apk.yml'

concurrency:
  group: build-merged-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    env:
      XIAOLE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      XIAOLE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      # 签名基线(纯小乐 xiaole-client-flutter-2027 一致):C=CN, O=ZCStudy, CN=XiaoLe Release
      # 见 docs/ci-artifact-6.11.9.md「签名基线」;只需方法,不写 p12 本体与密码以外的东西
      XIAOLE_CERT_SHA256: '9d2da8805e784801e13c54a635e8bf528db303a235adb5633745cadceb12a169'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Decode keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::缺少 KEYSTORE_BASE64 secret"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/xiaole-release.p12
          test -s android/app/xiaole-release.p12 || { echo "::error::keystore 解码为空"; exit 1; }
          echo "keystore bytes: $(wc -c < android/app/xiaole-release.p12)"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter 3.32.2 (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.2'
          channel: 'stable'
          cache: true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk/* 2>/dev/null || true
          df -h /

      - name: Add swap (7GB runner 编 Kotlin+Compose 容易触发 OOM/SIGTERM)
        run: |
          echo "swap already active:"; swapon --show || true
          sudo fallocate -l 6G /swapfile-ci || sudo dd if=/dev/zero of=/swapfile-ci bs=1M count=6144
          sudo chmod 600 /swapfile-ci
          sudo mkswap /swapfile-ci
          sudo swapon /swapfile-ci
          free -h

      - name: Fetch engine source (pinned) + apply embed patch
        run: bash scripts/fetch-mika.sh

      - name: flutter pub get
        run: flutter pub get

      # 79 轮 P2：版本号单一来源 = pubspec.yaml。去掉 `+79` 与 `-mika1` 后缀，
      # 通过 --dart-define 注入 Dart（设置页"关于"与 APK versionName 从此自动一致）。
      - name: Parse version from pubspec
        run: |
          V=$(grep -E '^version:' pubspec.yaml | head -n1 | awk '{print $2}')
          V=${V%%+*}
          V=${V%%-*}
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          echo "dart-define APP_VERSION=$V"

      - name: flutter analyze (error 才失败)
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings | tee analyze.log

      - name: Gradle 前置（Mika 测试输入路径 + local.properties）
        run: |
          # Mika 的 :mika-core:test 把 rootProject 下的 README/docs/eval 声明成输入；
          # 嵌入小乐后 rootProject 是 android/，这里补空占位，避免 Gradle 输入校验直接失败。
          mkdir -p android/docs android/eval android/tools/sandbox
          touch android/README.md android/tools/sandbox/README.md
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_ROOT" "${ANDROID_HOME:-/usr/local/lib/android/sdk}" > android/local.properties
          cat android/local.properties

      - name: Engine mic-gate unit test
        run: |
          set -o pipefail
          cd android
          ./gradlew :mika-core:test --tests "com.wangzan101.mika.core.voice.MicGateTest" 2>&1 | tee ../micgate-test.log

      - name: flutter build apk (universal, release)
        run: |
          set -o pipefail
          flutter build apk --release --dart-define=APP_VERSION=$APP_VERSION 2>&1 | tee build-universal.log
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/xiaole-6.11.23-mika1-universal.apk
          ls -lh dist

      - name: flutter build apk (arm64-only, release)
        run: |
          set -o pipefail
          # 主分发包：只打 arm64-v8a（真机 RMX3161 是 arm64）；versionCode 与 universal 相同
          echo "xiaole.abi=arm64-v8a" >> android/gradle.properties
          flutter build apk --release --target-platform android-arm64 --dart-define=APP_VERSION=$APP_VERSION 2>&1 | tee build-arm64.log
          cp build/app/outputs/flutter-apk/app-release.apk dist/xiaole-6.11.23-mika1-arm64.apk
          ls -lh dist

      - name: Slim assets (drop opus windows/web) + re-sign
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BUILD_TOOLS=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)
          for APK in dist/xiaole-6.11.23-mika1-universal.apk dist/xiaole-6.11.23-mika1-arm64.apk; do
            # opus 的 Windows/Web 二进制由 pub 依赖带进 flutter_assets，Android 只用 libopus.so
            zip -q -d "$APK" 'assets/flutter_assets/packages/opus_flutter_web/*' \
              'assets/flutter_assets/packages/opus_flutter_windows/*'
            # zip -d 会打乱对齐并让旧签名失效：重新对齐后再用同一把正式签名
            "$BUILD_TOOLS/zipalign" -p -f 4 "$APK" "$APK.aligned"
            mv "$APK.aligned" "$APK"
            "$BUILD_TOOLS/apksigner" sign --ks android/app/xiaole-release.p12 --ks-type pkcs12 \
              --ks-pass "pass:$XIAOLE_KEYSTORE_PASSWORD" --key-pass "pass:$XIAOLE_KEY_PASSWORD" \
              --ks-key-alias xiaole "$APK"
          done
          rm -f android/app/xiaole-release.p12
          echo "keystore removed from workspace"
          if unzip -l dist/xiaole-6.11.23-mika1-universal.apk | grep -qE 'opus_flutter_(web|windows)'; then
            echo "::error::opus 桌面/Web 资产没排掉"
            exit 1
          fi
          if unzip -l dist/xiaole-6.11.23-mika1-arm64.apk | grep -qE 'lib/armeabi-v7a'; then
            echo "::error::arm64 包里仍含 armeabi-v7a"
            exit 1
          fi

      - name: Verify both APKs (metadata, permissions & signature)
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BUILD_TOOLS=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)
          for APK in dist/xiaole-6.11.23-mika1-universal.apk dist/xiaole-6.11.23-mika1-arm64.apk; do
            NAME=$(basename "$APK" .apk)
            echo "### $NAME" | tee -a "$GITHUB_STEP_SUMMARY"
            "$BUILD_TOOLS/aapt2" dump badging "$APK" | head -n 3 | tee -a "$GITHUB_STEP_SUMMARY" || true
            "$BUILD_TOOLS/aapt2" dump permissions "$APK" > "dist/permissions-$NAME.txt"
            if grep -qE 'REQUEST_INSTALL_PACKAGES|WRITE_SECURE_SETTINGS|READ_MEDIA_VISUAL_USER_SELECTED' "dist/permissions-$NAME.txt"; then
              echo "::error::$NAME 权限裁剪失效,合并清单里仍有已剔除的权限"
              exit 1
            fi
            "$BUILD_TOOLS/apksigner" verify --print-certs --verbose "$APK" > "dist/certs-$NAME.txt" 2>&1
            cat "dist/certs-$NAME.txt" | tee -a "$GITHUB_STEP_SUMMARY"
            # 铁律「同包名必须同签名」:必须与纯小乐发布基线逐位一致,否则升级会退化成卸载重装+清数据
            if ! grep -q "$XIAOLE_CERT_SHA256" "dist/certs-$NAME.txt"; then
              echo "::error::$NAME 签名指纹与纯小乐基线不一致(同包名必须同签名)"
              exit 1
            fi
            ls -lh "$APK"
          done

      - name: Stage artifact
        run: |
          cp build-universal.log dist/build-universal.log || true
          cp build-arm64.log dist/build-arm64.log || true
          cp micgate-test.log dist/micgate-test.log || true
          cp analyze.log dist/analyze.log || true
          (cd dist && sha256sum *.apk | tee SHA256SUMS.txt)
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaole-single-apk
          path: dist/
          if-no-files-found: error
          retention-days: 14

