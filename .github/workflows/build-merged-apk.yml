name: Build Xiaole Single APK

# 正式单包构建:小乐(Flutter) + Mika(Kotlin 引擎)编进同一个 APK。
# 1. 检出本仓库(小乐 6.11.7 基线 + 嵌入改动)
# 2. scripts/fetch-mika.sh 把 Mika 固定到 6661b9e9 并打 patches/mika-embed.patch
# 3. android/settings.gradle.kts 以 include(":mika-core")/include(":mika-app") 并入
on:
  workflow_dispatch:
  push:
    branches:
      - feat/single-apk
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'patches/**'
      - 'scripts/**'
      - '.github/workflows/build-merged-apk.yml'

concurrency:
  group: build-merged-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      XIAOLE_KEYSTORE_PASSWORD: 'REDACTED-KEYSTORE-PASSWORD'
      XIAOLE_KEY_PASSWORD: 'REDACTED-KEYSTORE-PASSWORD'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter 3.32.2 (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.2'
          channel: 'stable'
          cache: true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk/* 2>/dev/null || true
          df -h /

      - name: Add swap (7GB runner 编 Kotlin+Compose 容易触发 OOM/SIGTERM)
        run: |
          echo "swap already active:"; swapon --show || true
          sudo fallocate -l 6G /swapfile-ci || sudo dd if=/dev/zero of=/swapfile-ci bs=1M count=6144
          sudo chmod 600 /swapfile-ci
          sudo mkswap /swapfile-ci
          sudo swapon /swapfile-ci
          free -h

      - name: Fetch engine source (pinned) + apply embed patch
        run: bash scripts/fetch-mika.sh

      - name: flutter pub get
        run: flutter pub get

      - name: Gradle 前置（Mika 测试输入路径 + local.properties）
        run: |
          # Mika 的 :mika-core:test 把 rootProject 下的 README/docs/eval 声明成输入；
          # 嵌入小乐后 rootProject 是 android/，这里补空占位，避免 Gradle 输入校验直接失败。
          mkdir -p android/docs android/eval android/tools/sandbox
          touch android/README.md android/tools/sandbox/README.md
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_ROOT" "${ANDROID_HOME:-/usr/local/lib/android/sdk}" > android/local.properties
          cat android/local.properties

      - name: Engine mic-gate unit test
        run: |
          set -o pipefail
          cd android
          ./gradlew :mika-core:test --tests "com.wangzan101.mika.core.voice.MicGateTest" 2>&1 | tee ../micgate-test.log

      - name: flutter build apk (release, stable signing)
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      - name: Verify APK metadata, permissions & signature
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BUILD_TOOLS=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | head -n 3 | tee -a "$GITHUB_STEP_SUMMARY" || true
          "$BUILD_TOOLS/aapt2" dump permissions "$APK" | tee permissions.txt
          if grep -qE 'REQUEST_INSTALL_PACKAGES|WRITE_SECURE_SETTINGS|READ_MEDIA_VISUAL_USER_SELECTED' permissions.txt; then
            echo "::error::权限裁剪失效,合并清单里仍有已剔除的权限"
            exit 1
          fi
          "$BUILD_TOOLS/apksigner" verify --print-certs --verbose "$APK" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          ls -lh "$APK"

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/xiaole-6.11.7-mika1.apk
          cp build.log dist/build.log || true
          cp micgate-test.log dist/micgate-test.log || true
          cp permissions.txt dist/permissions.txt || true
          sha256sum dist/xiaole-6.11.7-mika1.apk | tee dist/SHA256SUMS.txt
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaole-single-apk
          path: dist/
          if-no-files-found: error
          retention-days: 14

